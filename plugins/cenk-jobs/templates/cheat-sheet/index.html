<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>__TITLE__</title>
<style>
  /* Read at a glance during a call: few words, large type, a strong heading band per block, high contrast. */
  :root { color-scheme: light dark; --fg: #111; --muted: #4a4a4a; --bg: #fbfbf8; --band: #1f4e5a; --band-fg: #fff;
          --card: #fff; --line: #d4d4cc; --key: #0b3a8c; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #f2f2f2; --muted: #b5b5b5; --bg: #0f1213; --band: #2f7f8f; --band-fg: #0b0d0e; --card: #181c1e;
            --line: #2e3538; --key: #9cc7ff; }
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--fg); font: 600 16px/1.25 "Segoe UI", system-ui, -apple-system, sans-serif;
         overflow: hidden; }
  #sheet { box-sizing: border-box; height: 100vh; padding: 0.45em 0.6em; display: flex; flex-direction: column; }
  .top { display: flex; flex-wrap: wrap; gap: 0.2em 1em; align-items: baseline; padding: 0 0.1em 0.35em;
         margin-bottom: 0.45em; border-bottom: 3px solid var(--band); font-size: 0.8em; color: var(--muted); }
  .top b { font-size: 1.25em; color: var(--fg); }
  .top a { color: var(--key); }
  .top .size { margin-left: auto; font-weight: 400; font-size: 0.8em; }
  .grid { flex: 1; min-height: 0; column-count: __COLUMNS__; column-gap: 0.6em; column-fill: auto; }
  .block { break-inside: avoid; margin: 0 0 0.55em; background: var(--card); border: 1px solid var(--line);
           border-radius: 0.3em; overflow: hidden; }
  .block h2 { margin: 0; padding: 0.15em 0.45em; background: var(--band); color: var(--band-fg); font-size: 0.72em;
              letter-spacing: 0.06em; text-transform: uppercase; }
  .block p { margin: 0; padding: 0.2em 0.45em; border-top: 1px solid var(--line); }
  .block h2 + p { border-top: 0; }
  .block p b { color: var(--key); }
</style>
</head>
<body>
<div id="sheet">
  <div class="top">__TOP__<span class="size" id="size"></span></div>
  <div class="grid" id="grid">
__BLOCKS__
  </div>
</div>
<script>
// The text shrinks until the page fits its window without scrolling, and the size is shown in the top line.
// A column layout that overflows grows sideways, so both directions are measured.
(function () {
  var sheet = document.getElementById('sheet'), grid = document.getElementById('grid'), out = document.getElementById('size');
  function fits() {
    return grid.scrollWidth <= grid.clientWidth + 1 && sheet.scrollHeight <= window.innerHeight + 1;
  }
  function fit() {
    var size = 34;
    document.body.style.fontSize = size + 'px';
    while (size > 8 && !fits()) { size -= 0.5; document.body.style.fontSize = size + 'px'; }
    out.textContent = 'text ' + size + 'px' + (fits() ? '' : ' (still too long: shorten the keyword sheet)');
  }
  window.addEventListener('resize', fit);
  fit();
})();
</script>
</body>
</html>
